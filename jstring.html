<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Escaper</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 600;
    }

    p {
      margin: 0 0 24px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: white;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: #374151;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: #f87171;
    }

    .status.success {
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JSON → Escaped String</h1>
    <p>Converts a plain JSON object into a safe, double-escaped string that can be embedded inside JSON.parse("...").</p>

    <div class="panel">
      <label for="input">Input JSON</label>
      <textarea id="input" spellcheck="false">{
  "projectId": "example-id",
  "message": "Line one\nLine two",
  "nested": {
    "enabled": true
  }
}</textarea>
      <div class="actions">
        <button onclick="convert()">Convert</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <label for="output">Escaped Output</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="actions">
        <button onclick="copyOutput()">Copy</button>
      </div>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');

    function convert() {
      statusEl.textContent = '';
      statusEl.className = 'status';

      try {
        const obj = JSON.parse(inputEl.value);
        const escaped = JSON.stringify(JSON.stringify(obj));
        outputEl.value = escaped;

        statusEl.textContent = 'Valid JSON. Escaped successfully.';
        statusEl.classList.add('success');
      } catch (err) {
        outputEl.value = '';
        statusEl.textContent = 'Invalid JSON: ' + err.message;
        statusEl.classList.add('error');
      }
    }

    function copyOutput() {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value).then(() => {
        statusEl.textContent = 'Copied to clipboard.';
        statusEl.className = 'status success';
      });
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      statusEl.textContent = '';
      statusEl.className = 'status';
    }
  </script>
</body>
</html>
